[project]
name = "wookieelm2"
version = "0.2.0"
description = "Build a Star Wars pretraining corpus from Wookieepedia, paraphrase it, and distill a synthetic QA/SFT set from it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "rafa rrayes", email = "rafa@rayes.com.br" }]
keywords = ["star-wars", "wookieepedia", "corpus", "llm", "training-data"]
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mwparserfromhell>=0.7.2",
    "py7zr>=1.1.3",
    "pyarrow>=25.0.0",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# Only upload_hf.py needs this, and only when actually pushing to the Hub.
upload = ["huggingface-hub>=0.35.0"]

[project.urls]
Homepage = "https://github.com/rafa-rrayes/wookieeLM"
Repository = "https://github.com/rafa-rrayes/wookieeLM"
Issues = "https://github.com/rafa-rrayes/wookieeLM/issues"
